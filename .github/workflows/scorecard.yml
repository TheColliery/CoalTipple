name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 2'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

# cancel-in-progress: FALSE -- this job PUBLISHES (publish_results: true, an external
# OpenSSF badge/API write) and uploads a SARIF file GitHub persists as a code-scanning
# result. Cancelling mid-run risks a half-published score or a half-uploaded SARIF; let
# a superseded run finish rather than leave external state half-written.
#
# DELIBERATELY THE OPPOSITE OF codeql.yml's `true` (CWK-074 findings-back, checked because
# both this job and codeql.yml upload a SARIF to the same GitHub code-scanning system --
# superficially the same operation, cancelled two different ways here). The difference is
# real, not an oversight: THIS job makes TWO SEPARATE external writes in TWO SEPARATE steps
# to TWO DIFFERENT systems -- `ossf/scorecard-action`'s own `publish_results: true` to the
# OpenSSF Scorecard API, THEN a separate `upload-sarif` step to GitHub code-scanning -- so a
# cancel landing between those two steps leaves OpenSSF holding a fresh score while GitHub
# code-scanning still shows the stale SARIF. codeql.yml's own `analyze` step is ONE atomic
# action that computes AND uploads in a single external write, with no such window.
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: results.sarif
