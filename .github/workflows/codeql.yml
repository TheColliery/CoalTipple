name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# The ONE room-specific value in the CWK-058 change. DELIBERATELY WIDER than ci.yml's list and
# the asymmetry is the point: CodeQL analyzes js/ts, so NO markdown anywhere needs a security
# scan -- while ci.yml must still run on a SHIPPED markdown artifact, because verify.mjs checks
# dist-sync. Two different questions, two different exempt sets; collapsing them into one
# shared list would be wrong for whichever workflow lost. NOTICE added (CWK-058 scope
# decision, this room's own call, same reasoning as ci.yml's env comment): it is a non-shipped
# root doc beside LICENSE, and CodeQL never had a reason to scan either.
env:
  DOCS_GLOBS: "*.md **/*.md LICENSE NOTICE"

# cancel-in-progress: TRUE -- a superseded CodeQL run simply never uploads its SARIF, and the
# previous analysis stands; nothing is left half-written. The newer push analyzes the newer tree,
# which is the state anyone cares about.
#
# DELIBERATELY THE OPPOSITE OF scorecard.yml's `false` (CWK-074 findings-back, checked
# because both upload a SARIF to the same GitHub code-scanning system -- superficially the
# same operation, cancelled two different ways). The difference is real, not an oversight:
# this job's `github/codeql-action/analyze` step is ONE atomic action that computes AND
# uploads in a single external write -- there is no OUR-observable half-done state to
# interrupt. scorecard.yml's job makes TWO SEPARATE external writes in TWO SEPARATE steps to
# TWO DIFFERENT systems (its own `publish_results: true` to the OpenSSF Scorecard API, THEN a
# separate `upload-sarif` step to this same GitHub code-scanning system) -- a cancel landing
# between those two steps leaves OpenSSF holding a fresh score while GitHub code-scanning
# still shows the stale SARIF, a real divergence this job's single-step shape cannot produce.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DOC-ONLY DETECTION (CWK-058). Moved here from the workflow-level `paths-ignore` that
  # used to sit on `on:`. VERIFIED AT SOURCE why it had to move (GitHub's own docs,
  # content/actions/how-tos/manage-workflow-runs/skip-workflow-runs.md): "If a workflow is
  # skipped due to path filtering ... then checks associated with that workflow will remain
  # in a 'Pending' state. A pull request that requires those checks to be successful will be
  # blocked from merging." A required check that never fires is not a saved minute, it is a
  # branch that can never merge without an owner bypass -- which is exactly the bypass line
  # every push to this repo has been echoing.
  #
  # DOCS_GLOBS is the only room-specific value here: an adopting room edits this DATA and
  # nothing else. It must mirror what this workflow's own analysis genuinely does not need.
  changes:
    name: changed-paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      files: ${{ steps.detect.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        # DOCS_GLOBS comes from the workflow-level `env:` above, which GitHub exports into
        # every step's shell -- so it is deliberately NOT re-declared in this step's own
        # `env:` below (one more place to drift). That step-level `env:` carries only the
        # three event values.
        shell: bash
        # UMB-154. The three ${{ }} values reach the script through this step's `env:` and
        # are read as "$EVENT_NAME" / "$EVENT_BEFORE" / "$HEAD_SHA", never spliced into the
        # `run:` source. Actions substitutes ${{ }} as TEXT before bash parses the script, so
        # a value carrying a quote would become code; an env var is data. HONEST SCOPE: these
        # three are a SHA, a SHA and an event-name enum, not attacker-chosen text, so this is
        # defense-in-depth and the same variable names CoalHearth's classifier uses, not the
        # closing of a live hole. The attacker-chosen text in this step is the filenames in
        # `$changed`, and those were never interpolated. Full reasoning: the comment on the
        # `what this check actually did` step in the `analyze` job, further down.
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `set -f` (noglob) is LOAD-BEARING, not hygiene. Without it, `for g in $DOCS_GLOBS`
          # PATHNAME-EXPANDS the patterns against the checked-out tree before the loop runs, so
          # `*.md` silently becomes "the .md files that happen to exist here" and the comparison
          # is against filenames rather than patterns. `set -f` stops the EXPANSION while
          # leaving `case` pattern matching intact, which is exactly the split we need. (The bug
          # could only ever cause OVER-running, never a silent skip, because of the fail-safe
          # polarity below -- which is the reason that polarity is chosen rather than merely
          # preferred.)
          set -f
          # FAIL-SAFE POLARITY, and it is the whole safety argument: anything this step
          # cannot determine counts as CODE, never as docs-only. A wrong "docs-only" skips a
          # real analysis silently; a wrong "code" costs one cheap job. Never invert this.
          #
          # RUN-TIME RANDOM HEREDOC DELIMITER (CWK-074, shell-injection findings-back). A
          # FIXED delimiter ("EOF") is forgeable: a PR whose diff contains a file literally
          # named `EOF` terminates the $GITHUB_OUTPUT heredoc body early, and a later line in
          # that diff can then be read as a SECOND `code=` assignment -- GitHub's own
          # multi-line-output parser takes the LAST same-named key, so a forged `code=false`
          # after a real `code=true` silently flips the classifier's own output.
          # WHY $RANDOM SUFFICES, WRITTEN DOWN SO NOBODY "STRENGTHENS" THIS LATER: the defense
          # works by ORDERING, not entropy. `$changed` (the attacker's PR content) is already
          # frozen on disk before this line runs; the delimiter is generated AFTER that, so no
          # attacker can craft a matching filename in advance. $RANDOM not being a CSPRNG is
          # irrelevant -- the property that matters is "generated after the untrusted input is
          # fixed", not "hard to brute-force".
          emit() {
            local delim="EOF_${RANDOM}${RANDOM}${RANDOM}"
            echo "code=$1" >> "$GITHUB_OUTPUT"
            echo "files<<$delim" >> "$GITHUB_OUTPUT"
            echo "${2:-}" >> "$GITHUB_OUTPUT"
            echo "$delim" >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" != "push" ]; then
            echo "not a push event -- treating as code (fail-safe)"; emit true ""; exit 0
          fi
          before="$EVENT_BEFORE"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse -q --verify "${before}^{commit}" >/dev/null 2>&1; then
            echo "no usable base commit -- treating as code (fail-safe)"; emit true ""; exit 0
          fi
          changed="$(git diff --name-only "$before" "$HEAD_SHA" || true)"
          if [ -z "$changed" ]; then
            echo "empty diff -- treating as code (fail-safe)"; emit true ""; exit 0
          fi
          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            matched=false
            for g in $DOCS_GLOBS; do
              # shellcheck disable=SC2254
              case "$f" in $g) matched=true; break ;; esac
            done
            if [ "$matched" = false ]; then code=true; fi
          done <<< "$changed"
          echo "changed files:"; echo "$changed"
          echo "code=$code"
          emit "$code" "$changed"
  analyze:
    name: analyze (javascript)
    needs: changes
    # NOTE: the JOB is deliberately NOT `if:`-skipped. It must run so that a check-run named
    # `analyze (javascript)` exists for the ruleset to evaluate -- and so that the honesty step
    # below can SAY what happened. A skipped job reports a bare "skipped" with no explanation
    # anywhere a reader will find it.
    # `if: always()` for the SAME reason all-green checks its classifier: without it, a FAILED
    # `changes` job leaves this job skipped, and a skipped required check satisfies the ruleset
    # -- a green gate with neither a classification nor an analysis behind it. The job now
    # always runs and decides for itself, refusing below if the classifier did not succeed.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      # HONESTY STEP (CWK-058), FIRST so it is the first thing a reader sees. This check now
      # fires on every push, so it must distinguish "analyzed and clean" from "analyzed
      # nothing" without anyone reading a commit message.
      #
      # ATTACKER-CONTROLLED VALUES ARRIVE VIA env:, NEVER VIA ${{ }} IN THE SCRIPT BODY
      # (CWK-074, shell-injection findings-back) -- same reasoning as ci.yml's `all-green`
      # honesty step, ported here: `needs.changes.outputs.code`/`.files` trace to
      # `git diff --name-only`, filenames a PR AUTHOR chooses, and a direct ${{ }}
      # interpolation is textually substituted into this script's SOURCE before bash parses
      # it. Routed through `env:` and read as "$CODE"/"$FILES" instead.
      - name: what this check actually did
        env:
          CODE: ${{ needs.changes.outputs.code }}
          FILES: ${{ needs.changes.outputs.files }}
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            {
              echo "### analyze (javascript): FAILED -- the path classifier did not run"
              echo ""
              echo "\`changed-paths\` finished as \`${{ needs.changes.result }}\`, so this job cannot"
              echo "tell whether an analysis was needed. It refuses rather than reporting either way."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "changed-paths=${{ needs.changes.result }} -- refusing"
            exit 1
          fi
          if [ "$CODE" = "true" ]; then
            {
              echo "### analyze (javascript): a REAL CodeQL analysis ran"
              echo ""
              echo "Non-doc paths changed, so init + analyze executed and the SARIF was uploaded."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### analyze (javascript): NO ANALYSIS RAN -- this is not a clean bill of health"
              echo ""
              echo "Every changed path is markdown or LICENSE/NOTICE, which CodeQL does not analyze,"
              echo "so **no query was executed and no SARIF was uploaded.** The previous analysis for"
              echo "this branch is unchanged and still stands; nothing new was scanned."
              echo ""
              echo "This check reports success only so the branch ruleset that requires"
              echo "\`analyze (javascript)\` is satisfiable on a doc-only change. Read it as"
              echo "\"there was nothing to analyze\", never as \"the analysis passed\"."
              echo ""
              echo "Changed paths:"
              echo '```'
              echo "$FILES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
      # config-file (not the exemplar's `queries: security-and-quality`) is a NAMED room
      # divergence, unchanged by this port -- CoalTipple's own security-and-quality query
      # pack selection lives in this file, not inline.
      #
      # CWK-112 part 1 -- `actions` ADDED to `languages`, ONE job, no matrix. This repo's
      # own workflows (this file included) were never analyzed: CodeQL's `actions` language
      # covers the workflow query pack (untrusted checkout, expression/script injection,
      # excessive permissions), and only `javascript-typescript` was named here. The job
      # NAME stays `analyze (javascript)` -- unchanged, deliberately, because it is this
      # ruleset's required status-check context; a `strategy: matrix` per language renames
      # the job per matrix leg (e.g. `analyze (actions)`) and orphans the required check a
      # branch ruleset already pins by its current name. One job, two languages, one
      # `init`/`analyze` pair -- codeql-action already supports multiple `languages:` in one
      # job. A future reader: the name not matching "javascript, actions" is INTENTIONAL,
      # not a stale label -- do not "fix" it to match.
      #
      # `queries: - uses: security-and-quality` (the config-file below) RESOLVES PER
      # LANGUAGE, verified at the source rather than assumed: the github/codeql repo ships
      # `actions/ql/src/codeql-suites/actions-security-and-quality.qls` alongside every
      # other language's own `<lang>-security-and-quality.qls` (the same naming convention
      # confirmed for `python-security-and-quality.qls`) -- the suite NAME is a per-language
      # lookup key, not a single shared file, so `actions` gets its own real security suite,
      # not an empty one. The one `query-filters: exclude: id: js/automatic-semicolon-
      # insertion` in that config cannot reach `actions` findings either: CodeQL rule ids are
      # language-namespaced (`js/…` vs `actions/…`), so a `js/`-prefixed id can never match
      # an `actions/`-prefixed one -- the exclude is inert outside the JS pack by
      # construction, not by luck.
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
        with:
          languages: javascript-typescript, actions
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: needs.changes.result == 'success' && needs.changes.outputs.code == 'true'
